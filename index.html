<script>
    // --- TAB FUNCTIONALITY ---
    const tabs = document.querySelectorAll('.tab-btn');
    const cards = document.querySelectorAll('#menu-grid > article');

    tabs.forEach(tab => {
        tab.addEventListener('click', () => {
            tabs.forEach(t => { 
                t.classList.remove('tab-active'); 
                t.classList.add('bg-zinc-800', 'text-zinc-300'); 
                t.setAttribute('aria-selected', 'false'); 
            });
            tab.classList.add('tab-active'); 
            tab.classList.remove('bg-zinc-800', 'text-zinc-300'); 
            tab.setAttribute('aria-selected', 'true');
            
            const cat = tab.dataset.category;
            cards.forEach(c => {
                c.style.display = (cat === 'all' || c.dataset.cat === cat) ? '' : 'none';
            });
        });
    });

    // --- SHOPPING CART FUNCTIONALITY ---
    let cart = [];
    const addToCartButtons = document.querySelectorAll('.add-to-cart-btn');
    const cartContainer = document.getElementById('cart-container');
    const cartItemsList = document.getElementById('cart-items');
    const cartTotalDisplay = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    // Listen for clicks on "Add to Order"
    addToCartButtons.forEach(button => {
        button.addEventListener('click', (e) => {
            const name = e.target.getAttribute('data-name');
            const price = parseInt(e.target.getAttribute('data-price'));

            // Add item to our cart array
            cart.push({ name, price });
            
            // Update the display
            updateCartDisplay();
            
            // Slide the cart up into view if it's hidden
            cartContainer.classList.remove('translate-y-full');
            
            // Optional: Quick button animation
            e.target.innerText = "Added!";
            setTimeout(() => { e.target.innerText = "Add to Order"; }, 1000);
        });
    });

    function updateCartDisplay() {
        // Clear current list
        cartItemsList.innerHTML = '';
        let total = 0;

        // Loop through cart array and build HTML
        cart.forEach((item, index) => {
            total += item.price;
            const li = document.createElement('li');
            li.className = "flex justify-between border-b border-zinc-800 py-1";
            li.innerHTML = `<span>${item.name}</span> <span class="text-white">₱${item.price}</span>`;
            cartItemsList.appendChild(li);
        });

        // Update the total price
        cartTotalDisplay.innerText = `₱${total}`;
    }

    // Checkout button alert
    checkoutBtn.addEventListener('click', () => {
        if(cart.length === 0) return;
        alert(`Thank you for your order! Your total is ₱${cartTotalDisplay.innerText.replace('₱', '')}.`);
        // Reset cart after checkout
        cart = [];
        updateCartDisplay();
        cartContainer.classList.add('translate-y-full'); // Hide cart again
    });
  </script>
